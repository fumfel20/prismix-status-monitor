services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: prismix_app
    restart: unless-stopped
    working_dir: /var/www/prismix-status-monitor
    volumes:
      - ./:/var/www/prismix-status-monitor:cached
    environment:
      APP_ENV: dev
      APP_SECRET: 67d829bf61dc5f87a73fd814e2c9f629

  nginx:
    image: nginx:alpine
    container_name: prismix_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/prismix-status-monitor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
